<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Central CI/CD</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-dim: #8b949e;
            --success: #238636;
            --failed: #da3633;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            padding: 30px;
            margin: 0;
        }
        h1 { border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .title { font-size: 18px; font-weight: bold; }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-success { background-color: var(--success); }
        .badge-failed { background-color: var(--failed); }
        .info { font-size: 14px; color: var(--text-dim); margin: 5px 0; }
        .stats {
            background: #21262d;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <h1>📡 Panel de Control Central CI/CD</h1>
    <p>Monitoreo de pruebas y empaquetado de proyectos en tiempo de despliegue.</p>

    <div class="grid" id="monitor-grid">
        </div>

<script>
    // 1. REEMPLAZA AQUÍ CON TU USUARIO DE GITHUB
    const GITHUB_USER = "sloty00"; 

    // 2. Lista de los repositorios que quieres monitorear
    // (A medida que crees proyectos, solo sumas su nombre a esta lista)
    const misProyectos = [
        "Login-con-Java-JWT-MySQL-Firebase",
        "CASS-Workflow-Personal"
    ];

    const grid = document.getElementById('monitor-grid');

    // 3. Función lógica que va a buscar y abrir cada JSON por separado
    async function cargarReportes() {
        grid.innerHTML = ""; // Limpiar pantalla

        for (const repo of misProyectos) {
            // Construimos la URL nativa de donde estará el JSON de ese proyecto
            const urlJson = `https://${GITHUB_USER}.github.io/${repo}/reporte-cicd.json`;

            try {
                const response = await fetch(urlJson);
                if (!response.ok) throw new Error("No se encontró reporte");
                
                const data = await response.json();
                
                // Si encontramos el JSON, creamos la tarjeta visual
                const estadoClass = data.pipeline.estado === "SUCCESS" ? "badge-success" : "badge-failed";
                
                const cardHTML = `
                    <div class="card">
                        <div class="card-header">
                            <span class="title">${data.proyecto}</span>
                            <span class="badge ${estadoClass}">${data.pipeline.estado}</span>
                        </div>
                        <div class="info"><strong>Rama:</strong> ${data.rama} (${data.commit})</div>
                        <div class="info"><strong>Fecha:</strong> ${new Date(data.pipeline.fecha_ejecucion).toLocaleString()}</div>
                        
                        <div class="stats">
                            <strong>📊 Resultado de los Tests:</strong><br>
                            ✅ Pasados: ${data.tests.exitosos} / ❌ Fallados: ${data.tests.fallidos}<br>
                            🎯 Cobertura: ${data.tests.cobertura_codigo}
                        </div>
                        <p style="font-size: 13px; color: var(--text-dim); margin-top: 10px;">${data.detalles}</p>
                    </div>
                `;
                grid.innerHTML += cardHTML;

            } catch (error) {
                // Si el proyecto no ha subido su JSON o falló, mostramos tarjeta de alerta
                grid.innerHTML += `
                    <div class="card" style="opacity: 0.5;">
                        <div class="card-header">
                            <span class="title">${repo}</span>
                            <span class="badge" style="background:#444;">OFFLINE</span>
                        </div>
                        <p style="font-size: 13px; color: var(--text-dim);">Esperando primer reporte del pipeline de pruebas...</p>
                    </div>
                `;
            }
        }
    }

    // Ejecutar la carga al abrir la página
    cargarReportes();
</script>
</body>
</html>
