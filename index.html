<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Command Center</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --accent-success: #00ff9d;
            --accent-failed: #ff3e3e;
            --text-main: #e2e8f0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            padding: 40px;
            margin: 0;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050505 100%);
            min-height: 100vh;
        }

        h1 { font-weight: 800; letter-spacing: -1px; margin-bottom: 5px; }
        .subtitle { color: #64748b; margin-bottom: 40px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .title { font-size: 1.2rem; font-weight: 600; }
        
        .badge {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .badge-success { border: 1px solid var(--accent-success); color: var(--accent-success); box-shadow: 0 0 10px rgba(0,255,157,0.2); }
        .badge-failed { border: 1px solid var(--accent-failed); color: var(--accent-failed); box-shadow: 0 0 10px rgba(255,62,62,0.2); }

        .stats {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 12px;
            border-left: 3px solid #334155;
            margin-top: 15px;
        }

        .progress-bar {
            height: 4px;
            background: #1e293b;
            border-radius: 2px;
            margin-top: 10px;
        }

        .progress-fill { height: 100%; border-radius: 2px; transition: width 1s ease-in-out; }
    </style>
</head>
<body>

    <h1>📡 CI/CD Command Center</h1>
    <p class="subtitle">Monitoreo en tiempo real de flujos de despliegue</p>

    <div class="grid" id="monitor-grid"></div>

<script>
    const GITHUB_USER = "sloty00"; 
    const misProyectos = ["Login-con-Java-JWT-MySQL-Firebase", "CASS-Workflow-Personal", "MiradorFrutillar"];
    const grid = document.getElementById('monitor-grid');

    async function cargarReportes() {
        grid.innerHTML = ""; 

        for (const repo of misProyectos) {
            const urlJson = `https://${GITHUB_USER}.github.io/${repo}/reporte-cicd.json`;

            try {
                const response = await fetch(urlJson);
                if (!response.ok) throw new Error();
                const data = await response.json();
                
                const isSuccess = data.pipeline.estado === "SUCCESS";
                const colorClass = isSuccess ? "badge-success" : "badge-failed";
                
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-header">
                            <span class="title">${data.proyecto}</span>
                            <span class="badge ${colorClass}">${data.pipeline.estado}</span>
                        </div>
                        <div style="font-size: 0.85rem; color: #94a3b8;">Commit: ${data.commit.substring(0,7)}</div>
                        
                        <div class="stats">
                            <div style="font-size: 0.8rem; margin-bottom: 5px;">ESTADO DE PRUEBAS</div>
                            <div style="font-size: 1.2rem; font-weight: bold;">✅ ${data.tests.exitosos} / ❌ ${data.tests.fallidos}</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${data.tests.cobertura_codigo}; background: ${isSuccess ? 'var(--accent-success)' : 'var(--accent-failed)'}"></div>
                            </div>
                            <div style="font-size: 0.7rem; margin-top: 5px; color: #64748b;">Cobertura: ${data.tests.cobertura_codigo}</div>
                        </div>
                    </div>
                `;
            } catch (error) {
                grid.innerHTML += `
                    <div class="card" style="opacity: 0.6; border-style: dashed;">
                        <div class="card-header">
                            <span class="title">${repo}</span>
                            <span class="badge" style="border:1px solid #444; color:#666;">OFFLINE</span>
                        </div>
                        <p style="font-size: 0.85rem; color: #475569;">No se recibió señal del pipeline.</p>
                    </div>
                `;
            }
        }
    }

    cargarReportes();
</script>
</body>
</html>
