<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Command Center</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --accent-success: #00ff9d;
            --accent-failed: #ff3e3e;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            padding: 40px;
            margin: 0;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050505 100%);
            min-height: 100vh;
        }

        h1 { font-weight: 800; letter-spacing: -1px; margin-bottom: 5px; }
        .subtitle { color: var(--text-dim); margin-bottom: 40px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .title { font-size: 1.2rem; font-weight: 600; }
        
        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 800;
        }

        .badge-success { border: 1px solid var(--accent-success); color: var(--accent-success); }
        .badge-failed { border: 1px solid var(--accent-failed); color: var(--accent-failed); }

        .info-row { font-size: 0.85rem; color: var(--text-dim); margin: 4px 0; }
        
        .stats {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 12px;
            border-left: 3px solid #334155;
            margin: 15px 0;
        }

        .detalles {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-style: italic;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <h1>📡 CI/CD Command Center</h1>
    <p class="subtitle">Monitoreo de despliegue en tiempo real</p>

    <div class="grid" id="monitor-grid"></div>

<script>
    const GITHUB_USER = "sloty00"; 
    const misProyectos = ["Login-Basico-con-base-de-datos-Java", "Login-con-JWT-y-SQL", "Login-con-Java-JWT-MySQL-Firebase", "CASS-Workflow-Personal", "MiradorFrutillar"];
    const grid = document.getElementById('monitor-grid');

    async function obtenerLenguaje(repo) {
        try {
            const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${repo}/languages`);
            const data = await response.json();
            return Object.keys(data).length > 0 
                ? Object.keys(data).reduce((a, b) => data[a] > data[b] ? a : b) 
                : "N/A";
        } catch { return "N/A"; }
    }

    async function cargarReportes() {
        grid.innerHTML = ""; 

        for (const repo of misProyectos) {
            const urlJson = `https://${GITHUB_USER}.github.io/${repo}/reporte-cicd.json?t=${Date.now()}`;
            const lang = await obtenerLenguaje(repo);

            try {
                const response = await fetch(urlJson);
                if (!response.ok) throw new Error();
                const data = await response.json();
                
                // Lógica de seguridad: Si no existen datos de tests, asignamos valores por defecto
                const exitosos = data.tests?.exitosos ?? 0;
                const fallidos = data.tests?.fallidos ?? 0;
                const cobertura = data.tests?.cobertura_codigo ?? "0%";
                
                const isSuccess = data.pipeline.estado === "SUCCESS" || data.pipeline.estado === "success";
                const colorClass = isSuccess ? "badge-success" : "badge-failed";
                
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-header">
                            <span class="title">${data.proyecto}</span>
                            <span class="badge ${colorClass}">${data.pipeline.estado}</span>
                        </div>
                        
                        <div class="info-row"><strong>Stack:</strong> <span style="color: var(--accent-success)">${lang}</span></div>
                        <div class="info-row"><strong>Rama:</strong> ${data.rama}</div>
                        <div class="info-row"><strong>Commit:</strong> ${data.commit.substring(0,8)}</div>
                        <div class="info-row"><strong>Fecha:</strong> ${new Date(data.pipeline.fecha_ejecucion).toLocaleString()}</div>
                        
                        <div class="stats">
                            <div style="font-size: 0.75rem; margin-bottom: 5px; color: #fff;">RESULTADO DE TESTS</div>
                            <div style="font-size: 1rem;">✅ ${exitosos} / ❌ ${fallidos}</div>
                            <div style="font-size: 0.8rem; margin-top: 5px;">Cobertura: <strong>${cobertura}</strong></div>
                        </div>

                        <div class="detalles">
                            ${data.detalles}
                        </div>
                    </div>
                `;
            } catch (error) {
                grid.innerHTML += `
                    <div class="card" style="opacity: 0.6; border-style: dashed;">
                        <div class="card-header">
                            <span class="title">${repo}</span>
                            <span class="badge" style="border:1px solid #444; color:#666;">OFFLINE</span>
                        </div>
                        <div class="info-row"><strong>Stack:</strong> ${lang}</div>
                        <p style="font-size: 0.85rem; color: #475569;">Esperando reporte del pipeline...</p>
                    </div>
                `;
            }
        }
    }

    cargarReportes();
</script>
</body>
</html>
